# additional theming
for_window [floating] border pixel $border
for_window [tiling] border normal $border

for_window [app_id="com.mitchellh.ghostty" title="fastfetch"] floating enable, focus, move position 50 50

# workspace assignment
# NOTE:(@janezicmatej) app_ids change casing and separators across packaging; matches are case-insensitive substrings
assign [app_id="(?i)google-chrome"] workspace 2
assign [app_id="(?i)thunderbird"] workspace 3
assign [app_id="(?i)cider"] workspace 4
assign [app_id="(?i)boltlauncher"] workspace 5
assign [class="(?i)net-runelite"] workspace 5
assign [app_id="(?i)discord"] workspace 8
assign [app_id="(?i)slack"] workspace 8
assign [app_id="(?i)telegram"] workspace 8
assign [app_id="(?i)rocket.?chat"] workspace 8

# rules
for_window [app_id="com.gabm.satty"] fullscreen enable
for_window [class="net-runelite.*"] floating enable
no_focus [class="net-runelite.*"]

# idle
for_window [app_id=".*"] inhibit_idle fullscreen
for_window [class=".*"] inhibit_idle fullscreen
